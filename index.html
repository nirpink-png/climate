<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EcoClimate Studio</title>
  
  <!-- PWA & GitHub Pages Compatibility Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <style>
    /* Custom Glassmorphism styles */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dark .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .highlight-card {
      animation: pulseGlow 1.5s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0px rgba(34, 197, 94, 0.4); }
      100% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0.0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans pb-28">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-40 w-full glass border-b border-slate-200 dark:border-slate-800 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-leaf text-green-500 text-xl"></i>
        <span class="font-bold text-lg tracking-tight">EcoClimate</span>
      </div>
      <div class="flex items-center space-x-3">
        <!-- Language Switcher -->
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-200/80 dark:bg-slate-800/80 text-xs font-semibold px-2 py-1.5 rounded-lg border-none focus:ring-2 focus:ring-green-500 outline-none">
          <option value="en">English (EN)</option>
          <option value="es">Español (ES)</option>
          <option value="fr">Français (FR)</option>
          <option value="hi">हिन्दी (HI)</option>
        </select>
        <!-- Dark Mode Toggle -->
        <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-200/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- Location & Primary Weather Overview -->
    <section class="glass rounded-3xl p-6 text-center shadow-lg relative overflow-hidden">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-green-600 dark:text-green-400" id="txtLiveStatus">Live Status</span>
        <button onclick="toggleUnit()" class="text-xs font-bold bg-slate-200/70 dark:bg-slate-800/80 px-2.5 py-1 rounded-full
